name: logs-to-chest
template: mcbot
timeout: 180s
setup:
  - forceload add -330 140 -290 165
  - time set day
  - gamerule advance_time false
  - gamerule advance_weather false
  - weather clear
  - difficulty peaceful
  - fill -315 78 146 -305 78 156 minecraft:grass_block
  - fill -315 79 146 -305 85 156 minecraft:air
  - fill -312 79 148 -312 81 148 minecraft:oak_log
  - fill -312 79 154 -312 81 154 minecraft:oak_log
  - setblock -307 79 151 minecraft:chest[facing=west]
  - clear {player}
  - tp {player} -309.5 79 151.5 90 0
goal:
  description: Starting with empty inventory, gather wood from the nearby oak trunks, craft at least twelve oak planks, and deliver twelve oak planks into the chest at (-307,79,151).
  until:
    delivered:
      container: {x: -307, y: 79, z: 151}
      item: minecraft:oak_planks
      count: 12
