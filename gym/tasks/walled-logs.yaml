name: walled-logs
template: mcbot
timeout: 320s
settle: 2s
setup:
  - forceload add -330 140 -290 165
  - time set day
  - gamerule advance_time false
  - gamerule advance_weather false
  - weather clear
  - difficulty peaceful
  - fill -320 78 140 -300 78 160 minecraft:grass_block
  - fill -320 79 140 -300 94 160 minecraft:air
  # A low roof and stone-brick wall separate the player from visible logs.
  - fill -313 79 148 -307 81 154 minecraft:stone_bricks hollow
  - fill -311 79 150 -309 80 152 minecraft:air
  - setblock -313 80 151 minecraft:glass
  - fill -316 79 151 -316 82 151 minecraft:oak_log
  - clear {player}
  - tp {player} -309.5 79 151.5 90 0
goal:
  description: Gather four oak logs from the nearby tree.
  until:
    items:
      item: minecraft:oak_log
      count: 4
