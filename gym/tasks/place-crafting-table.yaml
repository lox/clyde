name: place-crafting-table
template: mcbot
timeout: 120s
setup:
  - forceload add -330 140 -290 165
  - time set day
  - gamerule advance_time false
  - gamerule advance_weather false
  - weather clear
  - difficulty peaceful
  # Flat 11x11 arena; the gold block marks the floor under the target.
  - fill -315 78 146 -305 78 156 minecraft:grass_block
  - fill -315 79 146 -305 85 156 minecraft:air
  - setblock -307 78 151 minecraft:gold_block
  - clear {player}
  - give {player} minecraft:crafting_table 1
  - tp {player} -309.5 79 151.5 -90 0
goal:
  description: Place your crafting table on top of the gold block in front of you.
  until:
    built:
      blocks:
        - pos: {x: -307, y: 79, z: 151}
          block: minecraft:crafting_table
